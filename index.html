<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="icon" href="/assets/img/logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/d060ea514a.js" crossorigin="anonymous"></script>
</head>
<body>
    <section id="main">
            <nav>
                <div class="nav-bar">
                    <img src="/assets/img/logo.png" alt="imagen del logo" class="logo">
                    <h3 class="subtitle">Character Counter</h3>
                </div>
                <button class="switch"><i class="fa-regular fa-sun"></i></button>
            </nav>    
            <div class="title">
               <h2>Analyze your text <br> in real-time.</h2>   
            </div>
        <textarea class="text-area" placeholder="Start tipying here...">“Design is the silent ambassador of your brand.
Simplicity is key to effective communication, creating clarity in every interaction.
A great design transforms complex ideas into elegant solutions, making them easy to understand.
It blends aesthetics and functionality seamlessly.</textarea>
            <div class="inputs">
                <div class="checkbox">
                    <label class="input-box">
                    <input type="checkbox">
                    <span class="icon-checked"></span>
                    Exclude Spaces
                    </label>
                    <label class="input-box">
                    <input type="checkbox">
                    <span class="icon-checked"></span>
                    Set character limits
                    </label>
                </div>
                    <p>Approx. reading time:1 minute</p>
            </div>
    <section class="cards">
        <div class="card1">
            <h2 class="value">278</h2>
            <p>Total Characters</p>
        </div>
        <div class="card2">
            <h2 class="value">39</h2>
            <p>Word Count</p>
        </div> 
        <div class="card3">
            <h2 class="value">04</h2>
            <p>Sentence Count</p>
        </div>
    </section>
    <section class="progress-bar">
        <h3>Letter Density</h3>
        <div class="letter">
            <h4>E</h4>
            <progress max="100" value="40"></progress>
            <h4>40 (16.06%)</h4>
        </div>
        <div class="letter">
            <h4>I</h4>
            <progress max="100" value="29"></progress>
            <h4>29 (11.65%)</h4>
        </div>
        <div class="letter">
            <h4>T</h4>
            <progress max="100" value="28"></progress>
            <h4>28 (11.24%)</h4>
        </div>
        <div class="letter">
            <h4>O</h4>
            <progress max="100" value="22"></progress>
            <h4>22 (8.84%)</h4>
        </div>
        <div class="letter">
            <h4>N</h4>    
            <progress max="100" value="21"></progress>
            <h4>21 (8.43%)</h4>
        </div>
    </section>
     <div class="see-more">
        <h4>See More</h4>
        <button class="btn-more"><i class="fa-solid fa-angle-down"></i>
        </button>
    </div>
    </section>
</body>
</html>
